# Inventaire statique — les IP privées sont fixes (attribuées par l'école).
# Ansible s'execute DEPUIS node-1 : le port 22 est fermé depuis Internet et le
# security group n'est pas modifiable, donc aucun acces SSH depuis l'exterieur.
# Seul le trafic intra-SG (10.0.0.0/24) passe. Voir bootstrap/README.md.
all:
  vars:
    ansible_user: ec2-user
    vpc_cidr: 10.0.0.0/24
    # Exposition — propre à AWS. L'EIP de node-1 est fixe et non déplaçable (C7).
    public_ip: "15.224.60.53"
    ingress_domain: "15.224.60.53.sslip.io"
    # ACME exige que l'Ingress soit joignable depuis Internet sur le port 80
    # (challenge HTTP-01) — vrai ici, faux en local.
    # Rester sur staging pendant tout le développement (risque #2 du README) :
    # le quota prod est de 50 certificats par domaine et par semaine.
    acme_enabled: true
    acme_email: "h.briffaux@gmail.com"
    acme_server: "https://acme-staging-v02.api.letsencrypt.org/directory"
    ingress_cluster_issuer: "letsencrypt"
  children:
    control_plane:
      hosts:
        node-1:
          ansible_host: 10.0.0.80
          node_ip: 10.0.0.80          # IP annoncée au cluster
          ansible_connection: local   # node-1 est le control node
          instance_id: i-082cacf2f59f8ddd4
    workers:
      hosts:
        node-2:
          ansible_host: 10.0.0.17
          node_ip: 10.0.0.17
          instance_id: i-0f11f75585a35e303
        node-3:
          ansible_host: 10.0.0.143
          node_ip: 10.0.0.143
          instance_id: i-03f48443ef76c0707
