---
# Contraintes imposées par l'infra fournie, vérifiées par appel API.
# Détail et preuves : docs/contraintes-et-outillage.md
#   - arm64 (t4g.medium, 2 vCPU / 4096 MiB) -> toute image doit être arm64
#   - 1 seule AZ, 1 seul subnet             -> anti-affinité sur hostname uniquement
#   - 30 Go de disque par nœud, non extensible
#   - EIP immobile sur node-1               -> pas de HA, reprise par reconstruction

arch: arm64

# ⚠ À VÉRIFIER avant le premier run : version stable courante sur pkgs.k8s.io.
# Cette valeur n'a pas été confirmée en ligne, elle est un point de départ.
k8s_minor: "v1.33"
k8s_version: "1.33.4"

# CNI. Images multi-arch, arm64 vérifié.
cilium_version: "1.20.2"

# Ingress. Chart 4.15.1 = app 1.15.1, arm64 vérifié.
ingress_nginx_version: "4.15.1"

# PKI et GitOps
cert_manager_version: "v1.21.2"
argocd_version: "10.9.2"

# acme_* est défini PAR INVENTAIRE, jamais ici : les variables de
# inventory/group_vars/ ont une précédence SUPÉRIEURE aux `vars` d'un fichier
# d'inventaire, un défaut posé ici écraserait silencieusement la surcharge locale.
helm_version: "v4.3.0"
helm_arm64_sha256: "31c5794dd55c66a51e6b7d2e2ac7a114ae8b1de41ff1d9ba51748ac973b06a08"

# Réseau. pod_network_cidr ne doit chevaucher ni vpc_cidr ni service_cidr.
# vpc_cidr est défini par inventaire : 10.0.0.0/24 sur AWS, 192.168.104.0/24 en local.
pod_network_cidr: "10.244.0.0/16"
service_cidr: "10.96.0.0/12"
control_plane_endpoint: "{{ hostvars[groups['control_plane'][0]].node_ip }}:6443"

# Stockage persistant. Monté par le userData via /etc/fstab, en NFS+TLS.
efs_id: "fs-038bf0f49474a6a1d"
efs_mount_point: "/mnt/efs"
