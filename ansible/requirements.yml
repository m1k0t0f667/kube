---
# ansible-core ne contient aucune de ces collections.
#   ansible-galaxy collection install -r requirements.yml
collections:
  - name: ansible.posix        # mount, sysctl
  - name: community.general    # modprobe
  - name: ansible.utils        # network_in_network (pré-vol CIDR)
  - name: kubernetes.core      # helm_repository, helm (cni, ingress-nginx, cert-manager, argocd)
