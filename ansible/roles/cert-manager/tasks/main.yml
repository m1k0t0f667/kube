---
- name: Dépôt Helm jetstack
  kubernetes.core.helm_repository:
    name: jetstack
    repo_url: https://charts.jetstack.io

- name: Déployer cert-manager
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: jetstack/cert-manager
    chart_version: "{{ cert_manager_version }}"
    release_namespace: cert-manager
    create_namespace: true
    values:
      crds:
        enabled: true
      resources:
        requests: { cpu: 10m, memory: 48Mi }
      webhook:
        resources:
          requests: { cpu: 10m, memory: 32Mi }
      cainjector:
        resources:
          requests: { cpu: 10m, memory: 64Mi }
    kubeconfig: /etc/kubernetes/admin.conf
    wait: true
    wait_timeout: 10m

- name: Manifeste des issuers
  ansible.builtin.template:
    src: issuers.yaml.j2
    dest: /etc/kubernetes/cert-manager-issuers.yaml
    mode: "0644"
  register: issuers_file

- name: Appliquer les issuers
  ansible.builtin.command: kubectl apply -f /etc/kubernetes/cert-manager-issuers.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: applied
  changed_when: "'configured' in applied.stdout or 'created' in applied.stdout"
  retries: 6
  delay: 10
  until: applied.rc == 0

# `kubectl wait` plutôt qu'un jsonpath : les guillemets d'un filtre jsonpath ne
# survivent pas au découpage d'arguments du module command.
- name: La CA interne est émise
  ansible.builtin.command: >-
    kubectl -n cert-manager wait --for=condition=Ready
    certificate/internal-ca --timeout=120s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false
