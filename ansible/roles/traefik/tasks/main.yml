# Point d'entrée HTTP/HTTPS du cluster. Joué sur le control-plane.

- name: Marquer le nœud d'entrée
  ansible.builtin.command: >-
    kubectl label node {{ inventory_hostname }}
    node-role.kubernetes.io/ingress=true --overwrite
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: labelled
  changed_when: "'not labeled' not in labelled.stdout"

# Migration : l'ancien contrôleur tient les hostPort 80/443, Traefik resterait
# Pending tant qu'il est là. Sans effet sur un cluster neuf.
- name: Retirer ingress-nginx (fin de vie)
  kubernetes.core.helm:
    name: ingress-nginx
    release_namespace: ingress-nginx
    state: absent
    kubeconfig: "{{ user_home }}/.kube/config"
    wait: true

- name: Valeurs Traefik
  ansible.builtin.template:
    src: values.yaml.j2
    dest: /etc/kubernetes/traefik-values.yaml
    mode: "0644"

- name: Dépôt Helm traefik
  kubernetes.core.helm_repository:
    name: traefik
    repo_url: https://traefik.github.io/charts

- name: Déployer Traefik
  kubernetes.core.helm:
    name: traefik
    chart_ref: traefik/traefik
    chart_version: "{{ traefik_version }}"
    release_namespace: traefik
    create_namespace: true
    values_files:
      - /etc/kubernetes/traefik-values.yaml
    kubeconfig: "{{ user_home }}/.kube/config"
    wait: true
    wait_timeout: 10m

- name: Le port 80 répond sur le nœud d'entrée (hostPort)
  ansible.builtin.uri:
    url: "http://{{ node_ip }}/"
    status_code: [404]      # 404 par défaut tant qu'aucun Ingress n'est défini
  register: probe
  retries: 12
  delay: 5
  until: probe is succeeded

- name: Le NodePort répond sur le nœud d'entrée
  ansible.builtin.uri:
    url: "http://{{ node_ip }}:30080/"
    status_code: [404]
  register: probe_nodeport
  retries: 12
  delay: 5
  until: probe_nodeport is succeeded
